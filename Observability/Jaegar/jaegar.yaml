apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger

  template:
    metadata:
      labels:
        app: jaeger

    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.53

        ports:
        - containerPort: 16686
        - containerPort: 4317
        - containerPort: 14250

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability

spec:
  type: NodePort
  selector:
    app: jaeger

  ports:
  - name: ui
    port: 16686
    targetPort: 16686
    nodePort: 30086
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: collector-grpc
    port: 14250
    targetPort: 14250

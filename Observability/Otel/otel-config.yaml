apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-config
  namespace: observability
data:
  otel.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:       # gRPC receiver for OTLP traces
          http:       # optional HTTP receiver

    processors:
      batch:         # batches traces for efficiency

    exporters:
      otlp:
        endpoint: jaeger.observability.svc.cluster.local:4317  # send traces to Jaeger OTLP gRPC
        tls:
          insecure: true

      logging:
        verbosity: detailed

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp, logging]

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: observability

spec:
  selector:
    matchLabels:
      app: node-exporter

  template:
    metadata:
      labels:
        app: node-exporter

    spec:
      hostPID: true

      containers:
      - name: node-exporter
        image: prom/node-exporter:v1.7.0

        ports:
        - containerPort: 9100

---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: observability

spec:
  selector:
    app: node-exporter

  ports:
  - port: 9100
